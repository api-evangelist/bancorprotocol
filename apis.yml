name: Bancorprotocol

image: https://framerusercontent.com/assets/Ge6tkw9lQSaRvH2tTNsL5262xQ.png

description: Bancorprotocol is a decentralized finance protocol that provides on‑chain liquidity, automated market making, and token conversion
  across multiple blockchains. Founded in 2017, Bancor enables users to trade assets instantly without order books, offering features like single‑sided
  liquidity provision, impermanent loss protection, and a suite of tools for developers to integrate on‑chain market infrastructure into their
  applications.

